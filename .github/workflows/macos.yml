name: macOS

on:
  workflow_dispatch:
  push:
    branches: [main, macos]
    paths: ["macos/**", "patches/**", "look/**", ".github/workflows/macos.yml"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  build:
    name: CherryTree ${{ matrix.version }} for macOS (Apple silicon)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        version: ["1.7.2", "1.2.0"]
    steps:
      - uses: actions/checkout@v5

      - name: Build CherryTree.app and the disk image
        run: macos/build-macos.sh --version ${{ matrix.version }}

      - name: Start it and take a screenshot
        run: macos/tests/smoke-test.sh work/macos/CherryTree.app smoke

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cherrytree-${{ matrix.version }}-macos-arm64
          path: |
            dist/*.dmg
            smoke/
          if-no-files-found: warn

  # temporary: how the runner's GUI session and screen-capture permission are set up
  diag:
    runs-on: macos-15
    steps:
      - run: |
          csrutil status || true
          sw_vers; who; id
          echo "--- process ancestry"; p=$$; while [ "$p" -gt 1 ]; do ps -o pid=,ppid=,comm= -p "$p"; p=$(ps -o ppid= -p "$p" | tr -d ' '); done
          for db in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            echo "--- $db"; sudo sqlite3 "$db" "select service, client, auth_value from access where service like '%Screen%' or service like '%Accessib%' or service like '%PostEvent%';" || true
            sudo sqlite3 "$db" "pragma table_info(access);" | cut -d'|' -f2 | tr '\n' ' '; echo
          done
