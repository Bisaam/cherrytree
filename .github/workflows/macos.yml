name: macOS

on:
  workflow_dispatch:
  push:
    branches: [main, macos]
    paths: ["macos/**", "patches/**", "look/**", ".github/workflows/macos.yml"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  build:
    name: CherryTree ${{ matrix.version }} for macOS (Apple silicon)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        version: ["1.7.2", "1.2.0"]
    steps:
      - uses: actions/checkout@v5

      - name: Build CherryTree.app and the disk image
        run: macos/build-macos.sh --version ${{ matrix.version }}

      - name: Start it and take a screenshot
        run: macos/tests/smoke-test.sh work/macos/CherryTree.app smoke

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cherrytree-${{ matrix.version }}-macos-arm64
          path: |
            dist/*.dmg
            smoke/
          if-no-files-found: warn


  # temporary control: does Homebrew's own cherrytree show a window on this runner?
  control-homebrew:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: |
          brew install --quiet cherrytree
          swiftc -O -o /tmp/windows macos/tests/windows.swift
          cherrytree > /tmp/ct.log 2>&1 &
          PID=$!
          for i in $(seq 1 24); do sleep 5; /tmp/windows > /tmp/w.txt; if grep -q "pid=${PID} " /tmp/w.txt; then echo "window after $((i*5)) s"; break; fi; done
          cat /tmp/w.txt; ps -o pid,stat,etime,command -p $PID || true
          grep -q "pid=${PID} " /tmp/w.txt || { sudo sample $PID 3 -file /tmp/s.txt; sudo cat /tmp/s.txt | head -150; }
          mkdir -p shot; screencapture -x shot/homebrew-cherrytree.png; kill $PID || true; echo "--- log"; cat /tmp/ct.log
      - uses: actions/upload-artifact@v7
        with:
          name: control-homebrew
          path: shot/
