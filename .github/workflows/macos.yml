name: macOS

on:
  workflow_dispatch:
  push:
    branches: [main, macos]
    paths: ["macos/**", "patches/**", "look/**", ".github/workflows/macos.yml"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  build:
    if: false   # temporary while diagnosing the start hang
    name: CherryTree ${{ matrix.version }} for macOS (Apple silicon)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        version: ["1.7.2", "1.2.0"]
    steps:
      - uses: actions/checkout@v5

      - name: Build CherryTree.app and the disk image
        run: macos/build-macos.sh --version ${{ matrix.version }}

      - name: Start it and take a screenshot
        run: macos/tests/smoke-test.sh work/macos/CherryTree.app smoke

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cherrytree-${{ matrix.version }}-macos-arm64
          path: |
            dist/*.dmg
            smoke/
          if-no-files-found: warn



  # temporary: diagnose the start hang on the app from an earlier build
  diag:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42061033967 -n cherrytree-1.7.2-macos-arm64 -D art
          hdiutil attach -nobrowse -mountpoint /tmp/dmg art/dist/*.dmg >/dev/null
          cp -R /tmp/dmg/CherryTree.app /tmp/CherryTree.app; hdiutil detach /tmp/dmg >/dev/null
          macos/tests/diag.sh /tmp/CherryTree.app diag
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diag
          path: diag/
