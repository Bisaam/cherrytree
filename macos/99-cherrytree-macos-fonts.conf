<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- macOS fallbacks after the bundled Cantarell / Fira Code (99-cherrytree-fonts.conf lists the
     Windows ones): installed to CherryTree.app/Contents/Resources/etc/fonts/conf.d/ -->
<fontconfig>
  <!-- grey antialiasing, as macOS itself does: on a Retina screen the coloured edges of the Linux
       RGB subpixel setting only make text look blurry. This file is read after
       99-cherrytree-fonts.conf, which sets the Linux rendering. -->
  <match target="font">
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>

  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Cantarell</family><family>Helvetica Neue</family></prefer>
  </alias>
  <alias binding="same">
    <family>Sans</family>
    <prefer><family>Cantarell</family><family>Helvetica Neue</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>Fira Code</family><family>Menlo</family></prefer>
  </alias>
  <alias binding="same">
    <family>Monospace</family>
    <prefer><family>Fira Code</family><family>Menlo</family></prefer>
  </alias>
  <alias>
    <family>Cantarell</family>
    <default><family>Helvetica Neue</family><family>Apple Color Emoji</family><family>Apple Symbols</family></default>
  </alias>
</fontconfig>
