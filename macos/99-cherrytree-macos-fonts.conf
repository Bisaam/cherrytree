<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- macOS fallbacks after the bundled Cantarell / Fira Code (99-cherrytree-fonts.conf lists the
     Windows ones): installed to CherryTree.app/Contents/Resources/etc/fonts/conf.d/ -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Cantarell</family><family>Helvetica Neue</family></prefer>
  </alias>
  <alias binding="same">
    <family>Sans</family>
    <prefer><family>Cantarell</family><family>Helvetica Neue</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>Fira Code</family><family>Menlo</family></prefer>
  </alias>
  <alias binding="same">
    <family>Monospace</family>
    <prefer><family>Fira Code</family><family>Menlo</family></prefer>
  </alias>
  <alias>
    <family>Cantarell</family>
    <default><family>Helvetica Neue</family><family>Apple Color Emoji</family><family>Apple Symbols</family></default>
  </alias>
</fontconfig>
