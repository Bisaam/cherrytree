<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- CherryTree bundled fonts + Linux (Xfce) style rendering defaults.
     Installed to <app>/ucrt64/etc/fonts/conf.d/ (Windows) or CherryTree.app/Contents/Resources/etc/fonts/conf.d/
     (macOS); paths are relative to this file. -->
<fontconfig>
  <dir prefix="relative">../../../share/fonts/cherrytree</dir>

  <!-- Xfce xsettings: Antialias=1 Hinting=1 HintStyle=hintslight RGBA=rgb -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>

  <!-- Linux-style generic families so "Sans"/"Monospace" resolve like on Linux -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Cantarell</family><family>Segoe UI</family></prefer>
  </alias>
  <alias binding="same">
    <family>Sans</family>
    <prefer><family>Cantarell</family><family>Segoe UI</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>Fira Code</family><family>Consolas</family></prefer>
  </alias>
  <alias binding="same">
    <family>Monospace</family>
    <prefer><family>Fira Code</family><family>Consolas</family></prefer>
  </alias>
  <!-- colour emoji fallback on Windows -->
  <alias>
    <family>Cantarell</family>
    <default><family>Segoe UI</family><family>Segoe UI Emoji</family><family>Segoe UI Symbol</family></default>
  </alias>
</fontconfig>
